name: Release builds

# Builds the Windows EXE and the Apple Silicon / Intel macOS apps in the cloud,
# launches each package on a matching machine, and only then uploads them to
# the GitHub release.
#
# Release: bump application/*version in export_presets.cfg, then push an
# annotated tag whose first line is the release title and whose body is the
# change list, e.g.  git tag -a v0.2.7 -m "Short title" -m "- change one"
# Test run without publishing: Actions -> Release builds -> Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the packages to the GitHub release named below"
        type: boolean
        default: false
      tag:
        description: "Release tag to upload to (only used when publishing)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Export and package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          preset=$(sed -n 's/^application\/short_version="\(.*\)"/\1/p' export_presets.cfg | head -n 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            if [ "$version" != "v$preset" ]; then
              echo "::error::Tag $version does not match the export version v$preset in export_presets.cfg"
              exit 1
            fi
          else
            version="v$preset"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-stable-macos

      - name: Install Godot and export templates
        run: |
          godot=$(sh tools/ci/install_godot.sh | tail -n 1)
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          "$godot" --version

      - name: Import project assets
        run: |
          # A fresh checkout imports every texture and model once.
          "$GODOT" --headless --path . --import || "$GODOT" --headless --path . --import

      - name: Export Windows and macOS
        run: |
          mkdir -p export/windows export/macos
          "$GODOT" --headless --path . --export-release "Windows x64" "$PWD/export/windows/CarRacing.exe"
          "$GODOT" --headless --path . --export-release "macOS Universal" "$PWD/export/macos/CarRacing.app"
          test -s export/windows/CarRacing.exe
          lipo -archs export/macos/CarRacing.app/Contents/MacOS/CarRacing

      - name: Package release files
        env:
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh tools/package_release.sh "${{ steps.version.outputs.version }}" export/windows/CarRacing.exe export/macos/CarRacing.app dist

      - uses: actions/upload-artifact@v4
        with:
          name: carracing-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Launch on ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: macOS Apple Silicon
            os: macos-15
            package: CarRacing-macOS-AppleSilicon
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            package: CarRacing-macOS-Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci

      - uses: actions/download-artifact@v4
        with:
          name: carracing-release
          path: dist

      - name: Launch the game
        shell: bash
        run: |
          if [ -n "${{ matrix.package }}" ]; then
            ditto -x -k "dist/${{ matrix.package }}.zip" unpacked
            app="unpacked/${{ matrix.package }}/CarRacing.app"
            codesign --verify --deep --strict "$app"
            bash tools/ci/smoke_test.sh "$app/Contents/MacOS/CarRacing" "${{ matrix.arch }}"
          else
            bash tools/ci/smoke_test.sh dist/CarRacing-Windows-x64.exe
          fi

  publish:
    name: Publish to the GitHub release
    needs: smoke
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: carracing-release
          path: dist

      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No release tag given"
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Keep the existing title and notes; replace the files.
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          subject=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
          python3 - "$TAG" "$RUN_URL" <<'PY'
          import subprocess, sys
          tag, run_url = sys.argv[1:3]
          body = subprocess.run(
              ["git", "for-each-ref", f"refs/tags/{tag}", "--format=%(contents:body)"],
              capture_output=True, text=True, check=True).stdout.strip()
          notes = open("tools/release/release_notes.md", encoding="utf-8").read()
          notes = notes.replace("{{CHANGES}}", "本次更新：\n\n" + body if body else "")
          notes = notes.replace("{{TAG}}", tag).replace("{{RUN_URL}}", run_url)
          open("release-notes.md", "w", encoding="utf-8").write(notes.lstrip())
          PY
          title="CarRacing $TAG"
          if [ -n "$subject" ]; then
            title="$title — $subject"
          fi
          gh release create "$TAG" dist/* --title "$title" --notes-file release-notes.md --latest
